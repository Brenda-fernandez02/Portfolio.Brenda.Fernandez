<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brenda — Portfolio IA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --border: rgba(255,255,255,0.07);
  --accent: #c8f060;
  --accent2: #7b5cf0;
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
}

/* NAV */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.2rem 3rem;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(12px);
}

.nav-logo { color: var(--accent); font-weight: 800; }
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a { color: var(--muted); text-decoration: none; text-transform: uppercase; font-size: 0.85rem; }

/* HERO */
.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 7rem 3rem 4rem;
}

.hero-visual { display:flex; justify-content:center; }
.orb { width:320px; height:320px; border-radius:50%; background:conic-gradient(#7b5cf0,#c8f060); filter:blur(60px); }

/* SECTIONS */
section { padding: 6rem 3rem; }
.section-label { color: var(--accent); text-transform: uppercase; font-size: 0.7rem; }

/* PROYECTOS (NETFLIX STYLE) */
.carousel-outer { position: relative; }

.carousel-track-wrap {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.projects-grid {
  display: flex;
  transition: transform 0.5s ease;
  will-change: transform;
}

.project-card {
  min-width: 100%;
  max-width: 100%;
  flex-shrink: 0;
  padding: 1.5rem;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}

/* VIDEO MEJORADO */
.project-card.video-card {
  padding: 0;
}

.video-wrapper {
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 520px;
  background: black;
  overflow: hidden;
}

.video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-badge {
  position:absolute;
  top:10px;
  left:10px;
  background: var(--accent);
  color:black;
  padding:4px 8px;
  font-size:10px;
  font-weight:800;
}

/* FILE CARDS */
.file-preview {
  display:flex;
  gap:10px;
  padding:10px;
  background: rgba(123,92,240,0.08);
  margin-bottom:10px;
}

/* CONTROLES */
.carousel-controls {
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:1rem;
}

.carousel-btn {
  width:32px; height:32px;
  border-radius:50%;
  border:1px solid var(--border);
  background: var(--surface);
  color:white;
  cursor:pointer;
}

.carousel-dots {
  display:flex;
  gap:6px;
}

.carousel-dot {
  width:6px; height:6px;
  background: var(--border);
  border-radius:50%;
}

.carousel-dot.active { background: var(--accent); }

</style>
</head>

<body>

<nav>
  <div class="nav-logo">B.</div>
  <ul class="nav-links">
    <li><a href="#proyectos">Proyectos</a></li>
  </ul>
</nav>

<section id="proyectos">
  <div class="section-label">Proyectos</div>
  <h2>Lo que he construido</h2>

  <div class="carousel-outer">
    <div class="carousel-track-wrap">
      <div class="projects-grid" id="carrusel">

        <!-- VIDEO -->
        <div class="project-card video-card">
          <div class="video-wrapper">
            <video controls>
              <source src="https://brenda-fernandez02.github.io/Portfolio.Brenda.Fernandez/avatar.mp4">
            </video>
          </div>
        </div>

        <!-- TFG -->
        <div class="project-card">
          <h3>TFG Enigma Room</h3>
          <p>Plan empresarial completo.</p>
        </div>

        <!-- EXCEL -->
        <div class="project-card">
          <h3>Excel Contabilidad</h3>
          <p>Modelo financiero avanzado.</p>
        </div>

      </div>
    </div>

    <div class="carousel-controls">
      <button class="carousel-btn" id="prev">←</button>
      <button class="carousel-btn" id="next">→</button>
      <div class="carousel-dots" id="dots"></div>
    </div>
  </div>
</section>

<script>
const track = document.getElementById('carrusel');
const cards = document.querySelectorAll('.project-card');
const dotsContainer = document.getElementById('dots');

let current = 0;

cards.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.classList.add('carousel-dot');
  if(i === 0) dot.classList.add('active');
  dot.onclick = () => goTo(i);
  dotsContainer.appendChild(dot);
});

function update() {
  track.style.transform = `translateX(-${current * 100}%)`;

  document.querySelectorAll('.carousel-dot').forEach((d,i)=>{
    d.classList.toggle('active', i === current);
  });

  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === cards.length - 1;
}

function goTo(i){
  current = Math.max(0, Math.min(i, cards.length - 1));
  update();
}

document.getElementById('prev').onclick = () => goTo(current - 1);
document.getElementById('next').onclick = () => goTo(current + 1);

update();
</script>

</body>
</html>
