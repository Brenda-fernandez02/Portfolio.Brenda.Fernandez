<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brenda — Portfolio IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* RESET TOTAL PARA EVITAR PANTALLA NEGRA */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-color: #0a0a0f;
            --card-color: #111118;
            --accent-color: #c8f060;
            --text-color: #f0ede8;
            --border-color: rgba(255,255,255,0.1);
        }

        body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            background: rgba(10,10,15,0.9);
            position: fixed;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .hero {
            padding: 150px 5% 50px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            min-height: 80vh;
        }

        .hero-text { flex: 1; min-width: 300px; }
        
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 span {
            color: transparent;
            -webkit-text-stroke: 1px var(--accent-color);
        }

        /* SECCIÓN PROYECTOS - AJUSTE PARA VIDEO VERTICAL (IMAGEN 1) */
        .projects-section { padding: 80px 5%; }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .project-card {
            background: var(--card-color);
            border-radius: 15px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: 0.3s;
        }

        .project-card:hover { border-color: var(--accent-color); }

        /* EL FIX DEL VIDEO */
        .video-box {
            width: 100%;
            height: 500px; /* Altura suficiente para video vertical */
            background: #000;
            display: flex;
            justify-content: center;
        }

        video {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain; /* Esto hace que se vea como en tu Foto 1 */
        }

        .project-info { padding: 20px; }
        .project-info h3 { font-family: 'Syne', sans-serif; margin-bottom: 10px; }
        .project-info p { font-size: 0.9rem; color: rgba(255,255,255,0.6); }

        /* IMAGEN CIRCULAR DEL HERO */
        .hero-img {
            flex: 1;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .
