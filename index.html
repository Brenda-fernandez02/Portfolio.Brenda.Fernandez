<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brenda — Portfolio IA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: rgba(255,255,255,0.07);
    --accent: #c8f060;
    --accent2: #7b5cf0;
    --text: #f0ede8;
    --muted: rgba(240,237,232,0.45);
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 3rem;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
  }
  .nav-logo {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text); }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 7rem 3rem 4rem;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(123,92,240,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; left: 30%;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,240,96,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-text { position: relative; z-index: 1; }
  .hero-eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .hero-eyebrow::before {
    content: '';
    display: inline-block;
    width: 28px; height: 1px;
    background: var(--accent);
  }
  h1 {
    font-family: var(--font-head);
    font-size: clamp(3rem, 6vw, 5.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 1.5rem;
  }
  h1 span {
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(200,240,96,0.6);
  }
  .hero-desc {
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 420px;
    margin-bottom: 2.5rem;
    font-weight: 300;
  }
  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--accent);
    color: #0a0a0f;
    padding: 0.85rem 2rem;
    border-radius: 2px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .hero-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(200,240,96,0.25);
  }
  .hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .orb {
    width: 320px; height: 320px;
    border-radius: 50%;
    background: conic-gradient(from 180deg at 50% 50%,
      #7b5cf0 0deg, #c8f060 120deg, #7b5cf0 240deg, #c8f060 360deg);
    filter: blur(60px);
    opacity: 0.5;
    animation: spin 12s linear infinite;
  }
  .orb-inner {
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SECTIONS */
  section { padding: 6rem 3rem; }
  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  h2 {
    font-family: var(--font-head);
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 3rem;
  }

  /* SOBRE MÍ */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: start;
  }
  .about-text { font-size: 1rem; color: var(--muted); font-weight: 300; }
  .about-text p + p { margin-top: 1rem; }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    border: 1px solid var(--border);
  }
  .stat {
    padding: 1.5rem;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .stat-num {
    font-family: var(--font-head);
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; }

  /* HABILIDADES */
  .skills-section { background: var(--surface); }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1px;
    border: 1px solid var(--border);
  }
  .skill-card {
    padding: 2rem;
    background: var(--bg);
    border: 1px solid var(--border);
    transition: background 0.3s, border-color 0.3s;
  }
  .skill-card:hover {
    background: rgba(123,92,240,0.06);
    border-color: rgba(123,92,240,0.3);
  }
  .skill-icon {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    display: block;
  }
  .skill-name {
    font-family: var(--font-head);
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--text);
  }
  .skill-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

  /* PROYECTOS */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1px;
    border: 1px solid var(--border);
  }
  .project-card {
    padding: 2.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    transition: background 0.3s;
  }
  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s;
  }
  .project-card:hover::before { transform: scaleX(1); }
  .project-card:hover { background: rgba(200,240,96,0.03); }
  .project-tag {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent2);
    border: 1px solid rgba(123,92,240,0.4);
    padding: 0.25rem 0.7rem;
    border-radius: 2px;
    margin-bottom: 1.2rem;
  }
  .project-title {
    font-family: var(--font-head);
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.8rem;
    color: var(--text);
  }
  .project-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
  .project-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 1.5rem;
  }
  .tool-pill {
    font-size: 0.72rem;
    padding: 0.2rem 0.6rem;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* VIDEO */
  .project-card.video-card {
    grid-column: 1 / -1;
    padding: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }
  .video-wrapper {
    position: relative;
    width: 100%;
    background: #000;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .video-wrapper video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
  }
  .video-badge {
    position: absolute;
    top: 1.5rem; left: 1.5rem;
    background: var(--accent);
    color: #0a0a0f;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    border-radius: 2px;
    z-index: 5;
  }
  .video-info {
    padding: 2.5rem 3rem;
  }

  /* TIMELINE */
  .education-section { background: var(--surface); }
  .timeline { position: relative; padding-left: 2rem; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    padding: 0 0 3rem 2rem;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -2rem;
    top: 0.4rem;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent);
    transform: translateX(-3.5px);
  }
  .timeline-year {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.4rem;
  }
  .timeline-title {
    font-family: var(--font-head);
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.2rem;
  }
  .timeline-org { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.7rem; }
  .timeline-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

  /* CONTACTO */
  .contact-section {
    text-align: center;
    background: var(--bg);
    padding: 6rem 3rem;
    position: relative;
    overflow: hidden;
  }
  .contact-section h2 { margin-bottom: 1rem; }
  .contact-section p { color: var(--muted); max-width: 440px; margin: 0 auto 3rem; font-size: 1rem; }
  .contact-links { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 1.8rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .contact-link:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
  }
  .contact-link.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
    font-weight: 700;
    font-family: var(--font-head);
  }

  /* FOOTER */
  footer {
    border
