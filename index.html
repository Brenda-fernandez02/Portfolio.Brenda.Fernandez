<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brenda — Portfolio IA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #121218;
    --surface: #181821;
    --surface-2: #1d1d29;
    --border: rgba(255,255,255,0.08);
    --accent: #c8f060;
    --accent2: #7b5cf0;
    --text: #f3efe9;
    --muted: rgba(243,239,233,0.65);
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.7;
    overflow-x: hidden;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 3rem;
    border-bottom: 1px solid var(--border);
    background: rgba(18,18,24,0.88);
    backdrop-filter: blur(12px);
  }

  .nav-logo {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  .nav-links { display: flex; gap: 2rem; list-style: none; }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--text); }

  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 7rem 3rem 4rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(123,92,240,0.16) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; left: 30%;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,240,96,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-text { position: relative; z-index: 1; }

  .hero-eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .hero-eyebrow::before {
    content: '';
    display: inline-block;
    width: 28px; height: 1px;
    background: var(--accent);
  }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(3rem, 6vw, 5.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 1.5rem;
  }

  h1 span {
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(200,240,96,0.6);
  }

  .hero-desc {
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 420px;
    margin-bottom: 2.5rem;
    font-weight: 300;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--accent);
    color: #0a0a0f;
    padding: 0.85rem 2rem;
    border-radius: 2px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .hero-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(200,240,96,0.25);
  }

  .hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .orb {
    width: 320px; height: 320px;
    border-radius: 50%;
    background: conic-gradient(from 180deg at 50% 50%,
      #7b5cf0 0deg, #c8f060 120deg, #7b5cf0 240deg, #c8f060 360deg);
    filter: blur(60px);
    opacity: 0.5;
    animation: spin 12s linear infinite;
  }

  .orb-inner {
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  section { padding: 6rem 3rem; }

  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  h2 {
    font-family: var(--font-head);
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 3rem;
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: start;
  }

  .about-text { font-size: 1rem; color: var(--muted); font-weight: 300; }
  .about-text p + p { margin-top: 1rem; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    border: 1px solid var(--border);
  }

  .stat {
    padding: 1.5rem;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .stat-num {
    font-family: var(--font-head);
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.04em;
  }

  .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; }

  .skills-section { background: var(--surface); }

  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1px;
    border: 1px solid var(--border);
  }

  .skill-card {
    padding: 2rem;
    background: var(--bg);
    border: 1px solid var(--border);
    transition: background 0.3s, border-color 0.3s;
  }

  .skill-card:hover {
    background: rgba(123,92,240,0.06);
    border-color: rgba(123,92,240,0.3);
  }

  .skill-icon {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    display: block;
  }

  .skill-name {
    font-family: var(--font-head);
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--text);
  }

  .skill-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }

  .carousel-outer { position: relative; }

  .carousel-track-wrap {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    padding: 1rem 0;
  }

  .projects-grid {
    display: flex;
    gap: 1rem;
    transition: transform 0.5s ease;
    will-change: transform;
    padding: 0 1rem;
  }

  .project-card {
    min-width: 80%;
    max-width: 80%;
    flex-shrink: 0;
    padding: 1.2rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s, background 0.3s, opacity 0.3s;
    display: flex;
    flex-direction: column;
    opacity: 0.65;
    transform: scale(0.92);
  }

  .project-card.active {
    opacity: 1;
    transform: scale(1);
  }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s;
  }

  .project-card.active::before,
  .project-card:hover::before { transform: scaleX(1); }

  .project-card:hover { background: rgba(200,240,96,0.03); }

  .project-card.video-card {
    padding: 0;
    background: var(--surface-2);
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0b0b10;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .video-wrapper video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #0b0b10;
  }

  .video-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.18), transparent 35%);
    pointer-events: none;
  }

  .video-badge {
    position: absolute;
    top: 0.8rem;
    left: 0.8rem;
    background: var(--accent);
    color: #0a0a0f;
    font-size: 0.55rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.25rem 0.55rem;
    border-radius: 3px;
    z-index: 5;
  }

  .video-info { padding: 1.2rem 1.2rem 1.4rem; }

  .project-card.file-card { padding: 1.2rem; }

  .file-preview {
    background: rgba(123,92,240,0.08);
    border: 1px solid rgba(123,92,240,0.2);
    border-radius: 10px;
    padding: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.9rem;
  }

  .file-icon { font-size: 1.2rem; flex-shrink: 0; }
  .file-meta { font-size: 0.65rem; color: var(--muted); }
  .file-name { font-size: 0.72rem; color: var(--text); font-weight: 500; margin-bottom: 0.1rem; }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    margin-top: auto;
    padding: 0.45rem 0.85rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 3px;
    font-size: 0.65rem;
    font-family: var(--font-head);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
    width: fit-content;
  }

  .download-btn:hover {
    background: var(--accent);
    color: #0a0a0f;
  }

  .carousel-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1rem;
  }

  .carousel-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
    flex-shrink: 0;
  }

  .carousel-btn:hover {
    border-color: var(--accent);
    background: rgba(200,240,96,0.08);
    transform: scale(1.05);
  }

  .carousel-btn:disabled {
    opacity: 0.25;
    cursor: default;
  }

  .carousel-dots {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    flex: 1;
  }

  .carousel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }

  .carousel-dot.active {
    background: var(--accent);
    transform: scale(1.5);
  }

  .project-tag {
    display: inline-block;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent2);
    border: 1px solid rgba(123,92,240,0.4);
    padding: 0.15rem 0.5rem;
    border-radius: 2px;
    margin-bottom: 0.7rem;
  }

    font-family: var(--font-head);
    font-size:
