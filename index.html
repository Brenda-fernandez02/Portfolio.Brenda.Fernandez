<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portfolio</title>
  <style>
    body { margin: 0; font-family: Arial; background: #0f172a; color: #e2e8f0; }
    header { padding: 40px; text-align: center; background: #1e293b; }
    section { padding: 40px; max-width: 1100px; margin: auto; }

    .carousel { display: flex; gap: 20px; overflow-x: auto; }
    .card {
      min-width: 280px;
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
    }
    img { width: 100%; border-radius: 10px; }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      max-width: 700px;
      width: 90%;
      position: relative;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
    }
    video { width: 100%; border-radius: 10px; }
    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>Brenda Fernández</h1>
  <p>Administrativa | Agente digitalizador</p>
</header>

<section>
  <h2>Proyectos</h2>
  <div class="carousel">

    <div class="card" onclick="openModal('video-avatar.mp4','Avatar profesional')">
      <h3>Avatar profesional</h3>
      <img src="preview.jpg">
    </div>

    <div class="card" onclick="openModal('video2.mp4','Proyecto 2')">
      <h3>Proyecto 2</h3>
      <img src="proyecto1.jpg">
    </div>

  </div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <h3 id="modal-title"></h3>
    <video id="modal-video" controls></video>
    <button>Ver Demo</button>
    <button>Enlace al Proyecto</button>
  </div>
</div>

<script>
function openModal(videoSrc, title) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-video').src = videoSrc;
  document.getElementById('modal-title').innerText = title;
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('modal-video').pause();
}
</script>

</body>
</html>
