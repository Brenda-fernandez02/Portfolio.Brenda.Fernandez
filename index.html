<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brenda — Portfolio IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --border: rgba(255,255,255,0.07);
  --accent: #c8f060;
  --accent2: #7b5cf0;
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
}

/* NAV */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  padding: 1.2rem 3rem;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(12px);
}

/* HERO ORIGINAL RESTAURADO */
.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 7rem 3rem 4rem;
}

.hero-visual {
  display: flex;
  justify-content: center;
  align-items: center;
}

.orb {
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: conic-gradient(from 180deg,
    #7b5cf0, #c8f060, #7b5cf0);
  filter: blur(60px);
  opacity: 0.5;
  animation: spin 12s linear infinite;
}

.orb-inner {
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  overflow: hidden;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* SECCIONES */
section { padding: 6rem 3rem; }

/* =========================
   PROYECTOS CARRUSEL
========================= */
.carousel-track-wrap {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.projects-grid {
  display: flex;
  transition: transform 0.6s ease;
  width: 100%;
}

/* 1 PROYECTO POR VISTA */
.project-card {
  min-width: 100%;
  max-width: 100%;
  padding: 2.5rem;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 1rem;
  transition: transform 0.3s ease;
}

/* efecto “propuesta premium” */
.project-card.active {
  transform: scale(1.01);
  box-shadow: 0 0 40px rgba(200,240,96,0.08);
}

/* VIDEO CORREGIDO */
.video-wrapper {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  overflow: hidden;
  background: black;
}

.video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover; /* mejor encuadre visual */
}

/* BOTONES */
.carousel-controls {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 1rem;
}

.carousel-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

.carousel-btn:hover {
  border-color: var(--accent);
}

/* DOTS */
.carousel-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--border);
}

.carousel-dot.active {
  background: var(--accent);
}
</style>
</head>

<body>

<nav>
  <div>B.</div>
</nav>

<!-- HERO RESTAURADO -->
<section class="hero">
  <div>
    <h1>Hola, soy Brenda</h1>
  </div>

  <div class="hero-visual">
    <div class="orb"></div>
    <div class="orb-inner">
      <img src="https://brenda-fernandez02.github.io/Portfolio.Brenda.Fernandez/foto.jpg"
           style="width:100%;height:100%;object-fit:cover;">
    </div>
  </div>
</section>

<!-- PROYECTOS (VIDEO DE VUELTA AQUÍ) -->
<section id="proyectos">

<h2>Proyectos</h2>

<div class="carousel-track-wrap">
  <div class="projects-grid" id="carrusel">

    <!-- VIDEO -->
    <div class="project-card active">
      <div class="video-wrapper">
        <video controls>
          <source src="https://brenda-fernandez02.github.io/Portfolio.Brenda.Fernandez/avatar.mp4">
        </video>
      </div>

      <h3>Avatar IA</h3>
      <p>Video generado con inteligencia artificial</p>
    </div>

    <!-- PROYECTO 2 -->
    <div class="project-card">
      <h3>TFG Empresa</h3>
      <p>Plan empresarial completo</p>
    </div>

    <!-- PROYECTO 3 -->
    <div class="project-card">
      <h3>Excel Contabilidad</h3>
      <p>Modelo financiero avanzado</p>
    </div>

  </div>
</div>

<div class="carousel-controls">
  <button class="carousel-btn" onclick="move(-1)">←</button>
  <button class="carousel-btn" onclick="move(1)">→</button>
</div>

</section>

<script>
const track = document.getElementById("carrusel");
const cards = document.querySelectorAll(".project-card");

let index = 0;

function update() {
  track.style.transform = `translateX(-${index * 100}%)`;

  cards.forEach((c, i) => {
    c.classList.toggle("active", i === index);
  });
}

function move(dir) {
  index = Math.max(0, Math.min(index + dir, cards.length - 1));
  update();
}

let startX = 0;

track.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

track.addEventListener("touchend", e => {
  let diff = startX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) move(diff > 0 ? 1 : -1);
});

update();
</script>

</body>
</html>
