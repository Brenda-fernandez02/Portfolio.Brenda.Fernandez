<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brenda — Portfolio IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --border: rgba(255,255,255,0.07);
  --accent: #c8f060;
  --accent2: #7b5cf0;
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
}

/* NAV */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  padding: 1.2rem 3rem;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(12px);
}

/* HERO */
.hero {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 7rem 3rem 4rem;
}

/* SECTIONS */
section { padding: 6rem 3rem; }

/* =========================
   VIDEO MEJORADO
========================= */
.video-wrapper {
  position: relative;
  background: black;
  overflow: hidden;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  max-height: 420px; /* MÁS GRANDE */
}

.video-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: contain; /* evita cortes de cara */
  background: black;
}

.video-badge {
  position: absolute;
  top: 0.6rem;
  left: 0.6rem;
  background: var(--accent);
  color: black;
  font-size: 0.6rem;
  padding: 0.2rem 0.5rem;
  font-weight: 800;
}

/* =========================
   CARRUSEL 1 PROYECTO
========================= */
.carousel-track-wrap {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.projects-grid {
  display: flex;
  transition: transform 0.55s ease;
  width: 100%;
}

/* SOLO 1 PROYECTO VISIBLE */
.project-card {
  min-width: 100%;
  max-width: 100%;
  flex-shrink: 0;
  padding: 2rem;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* TITULOS */
.project-title {
  font-family: var(--font-head);
  font-size: 1.1rem;
}

/* BOTONES CARRUSEL */
.carousel-controls {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 1rem;
}

.carousel-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

.carousel-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--border);
}

.carousel-dot.active {
  background: var(--accent);
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .hero { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<nav>
  <div>B.</div>
</nav>

<section class="hero">
  <div>
    <h1>Hola, soy Brenda</h1>
  </div>

  <div>
    <div class="video-wrapper">
      <video controls playsinline>
        <source src="https://brenda-fernandez02.github.io/Portfolio.Brenda.Fernandez/avatar.mp4">
      </video>
      <div class="video-badge">AI VIDEO</div>
    </div>
  </div>
</section>

<section id="proyectos">
  <h2>Proyectos</h2>

  <div class="carousel-track-wrap">
    <div class="projects-grid" id="carrusel">

      <div class="project-card">
        <div class="project-title">Avatar IA</div>
        <p>Vídeo generado con IA</p>
      </div>

      <div class="project-card">
        <div class="project-title">TFG Empresa</div>
        <p>Plan empresarial completo</p>
      </div>

      <div class="project-card">
        <div class="project-title">Excel Contabilidad</div>
        <p>Modelo financiero avanzado</p>
      </div>

    </div>
  </div>

  <div class="carousel-controls">
    <button class="carousel-btn" onclick="move(-1)">←</button>
    <button class="carousel-btn" onclick="move(1)">→</button>
  </div>

</section>

<script>
const track = document.getElementById("carrusel");
const cards = document.querySelectorAll(".project-card");

let index = 0;

function update() {
  track.style.transform = `translateX(-${index * 100}%)`;
}

function move(dir) {
  index = Math.max(0, Math.min(index + dir, cards.length - 1));
  update();
}

// swipe móvil
let startX = 0;

track.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

track.addEventListener("touchend", e => {
  let diff = startX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) move(diff > 0 ? 1 : -1);
});

update();
</script>

</body>
</html>
